[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "capl"
version = "0.1.0"
description = "Context-Aware Unsupervised Human Preference Learning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.48.0",
    "accelerate>=0.34.0",
    "peft>=0.10.0",
    "datasets>=2.18.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "pytest>=8.0.0",
    "scikit-learn>=1.4.0",
    "matplotlib>=3.8.0",
    "rich>=13.7.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
